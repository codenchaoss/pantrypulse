<div class="login-page">
    <div class="left-section">
        <img src="/assets/logo/logo.png" alt="PantryPulse Logo" class="logo">
    </div>

    <div class="right-section">
        <div class="login-card">
            <h1 class="welcome-title">
                Reset Password 🔒
            </h1>
            <p class="welcome-subtitle">
                Enter your new password below
            </p>

            <div *ngIf="errorMessage" class="alert-box error-alert">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ errorMessage }}</span>
            </div>

            <div *ngIf="successMessage" class="alert-box success-alert">
                <i class="fa-solid fa-circle-check"></i>
                <span>{{ successMessage }}</span>
            </div>

            <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
                <!-- New Password -->
                <div class="input-group">
                    <label>New Password</label>
                    <div class="input-box" [class.is-invalid]="f['newPassword'].touched && f['newPassword'].invalid">
                        <i class="fa-solid fa-lock"></i>
                        <input
                            [type]="showPassword ? 'text' : 'password'"
                            formControlName="newPassword"
                            placeholder="Enter new password">
                        <i
                            [class]="showPassword ? 'fa-regular fa-eye-slash eye-icon' : 'fa-regular fa-eye eye-icon'"
                            (click)="toggleShowPassword()"></i>
                    </div>
                    <div class="field-error" *ngIf="f['newPassword'].touched && f['newPassword'].invalid">
                        <span *ngIf="f['newPassword'].errors?.['required']">New password is required.</span>
                        <span *ngIf="f['newPassword'].errors?.['minlength']">Password must be at least 6 characters.</span>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <label>Confirm Password</label>
                    <div class="input-box" [class.is-invalid]="f['confirmPassword'].touched && f['confirmPassword'].invalid">
                        <i class="fa-solid fa-lock"></i>
                        <input
                            [type]="showConfirmPassword ? 'text' : 'password'"
                            formControlName="confirmPassword"
                            placeholder="Confirm new password">
                        <i
                            [class]="showConfirmPassword ? 'fa-regular fa-eye-slash eye-icon' : 'fa-regular fa-eye eye-icon'"
                            (click)="toggleShowConfirmPassword()"></i>
                    </div>
                    <div class="field-error" *ngIf="f['confirmPassword'].touched && f['confirmPassword'].invalid">
                        <span *ngIf="f['confirmPassword'].errors?.['required']">Please confirm your password.</span>
                    </div>
                    <div class="field-error" *ngIf="resetPasswordForm.hasError('mismatch') && f['confirmPassword'].touched">
                        <span>Passwords do not match.</span>
                    </div>
                </div>

                <button
                    type="submit"
                    class="login-btn"
                    [disabled]="isSubmitting">
                    <span *ngIf="!isSubmitting">Reset Password</span>
                    <i *ngIf="!isSubmitting" class="fa-solid fa-arrow-right"></i>
                    <mat-spinner *ngIf="isSubmitting" diameter="24" color="accent"></mat-spinner>
                    <span *ngIf="isSubmitting" class="spinner-text">Resetting...</span>
                </button>

                <div class="bottom-link">
                    Remembered your password?
                    <a routerLink="/login">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
