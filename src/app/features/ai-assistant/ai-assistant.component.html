<div class="ai-assistant-page">

  <div class="assistant-card">
    
    <!-- FUTURISTIC SVG ILLUSTRATION -->
    <div class="svg-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="robot-svg">
        <defs>
          <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#d97706" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#1b1b1b" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4b5563"/>
            <stop offset="50%" stop-color="#1f2937"/>
            <stop offset="100%" stop-color="#111827"/>
          </linearGradient>
          <linearGradient id="neonOrange" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#d97706"/>
          </linearGradient>
        </defs>

        <!-- Ambient Glow -->
        <circle cx="100" cy="100" r="80" fill="url(#glow)"/>

        <!-- Robot Body -->
        <!-- Neck -->
        <rect x="92" y="115" width="16" height="20" rx="4" fill="#374151" stroke="#4b5563" stroke-width="2"/>
        
        <!-- Base / Torso Top -->
        <path d="M 70 135 L 130 135 L 120 165 L 80 165 Z" fill="url(#metal)" stroke="#4b5563" stroke-width="2"/>
        <circle cx="100" cy="150" r="6" fill="url(#neonOrange)"/>

        <!-- Head outer shell -->
        <rect x="60" y="55" width="80" height="65" rx="20" fill="url(#metal)" stroke="#4b5563" stroke-width="3"/>

        <!-- Ears/Antennae bases -->
        <rect x="52" y="75" width="8" height="25" rx="3" fill="#374151"/>
        <rect x="140" y="75" width="8" height="25" rx="3" fill="#374151"/>

        <!-- Antenna -->
        <line x1="100" y1="55" x2="100" y2="35" stroke="#4b5563" stroke-width="3"/>
        <circle cx="100" cy="32" r="6" fill="url(#neonOrange)" class="pulse"/>

        <!-- Visor Faceplate -->
        <rect x="70" y="67" width="60" height="36" rx="10" fill="#111827" stroke="#374151" stroke-width="2"/>

        <!-- Visor Neon Glow Path (Eyes) -->
        <rect x="78" y="77" width="44" height="6" rx="3" fill="url(#neonOrange)"/>
        
        <!-- Blinking Lights -->
        <circle cx="85" cy="91" r="2" fill="#10b981" class="blink-fast"/>
        <circle cx="93" cy="91" r="2" fill="#3b82f6" class="blink-slow"/>
        <circle cx="101" cy="91" r="2" fill="#f59e0b"/>

        <!-- Decorative details -->
        <line x1="80" y1="123" x2="120" y2="123" stroke="#d97706" stroke-dasharray="2,2"/>
      </svg>
    </div>

    <!-- Title and message -->
    <h2 class="assistant-title">{{ title }}</h2>
    <p class="assistant-message">{{ message }}</p>

    <!-- Visual status badge -->
    <div class="status-indicator">
      <span class="pulse-dot"></span>
      <span class="status-text">Pending Integration</span>
    </div>

  </div>

</div>
