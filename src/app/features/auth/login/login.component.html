<div class="login-page">

    <div class="left-section">

        <img
            src="/assets/logo/logo.png"
            alt="PantryPulse Logo"
            class="logo">

    </div>


    <div class="right-section">

        <div class="login-card">

            <h1 class="welcome-title">
                Welcome Back 👋
            </h1>

            <p class="welcome-subtitle">
                Sign in to continue to your account
            </p>

            <div *ngIf="errorMessage" class="alert-box error-alert">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ errorMessage }}</span>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

                <!-- Email -->
                <div class="input-group">

                    <label>Email</label>

                    <div class="input-box" [class.is-invalid]="f['email'].touched && f['email'].invalid">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            formControlName="email"
                            placeholder="Enter your email">

                    </div>

                    <div class="field-error" *ngIf="f['email'].touched && f['email'].invalid">
                        <span *ngIf="f['email'].errors?.['required']">Email address is required.</span>
                        <span *ngIf="f['email'].errors?.['email']">Please enter a valid email address.</span>
                    </div>

                </div>

                <!-- Password -->
                <div class="input-group">

                    <label>Password</label>

                    <div class="input-box" [class.is-invalid]="f['password'].touched && f['password'].invalid">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            [type]="showPassword ? 'text' : 'password'"
                            formControlName="password"
                            placeholder="Enter your password">

                        <i
                            [class]="showPassword ? 'fa-regular fa-eye-slash eye-icon' : 'fa-regular fa-eye eye-icon'"
                            (click)="toggleShowPassword()"></i>

                    </div>

                    <div class="field-error" *ngIf="f['password'].touched && f['password'].invalid">
                        <span *ngIf="f['password'].errors?.['required']">Password is required.</span>
                        <span *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters.</span>
                    </div>

                </div>

                <div class="login-options">

                    <label class="remember">

                        <input type="checkbox" formControlName="rememberMe">

                        Remember Me

                    </label>

                    <a routerLink="/forgot-password">

                        Forgot Password?

                    </a>

                </div>

                <button
                    type="submit"
                    class="login-btn"
                    [disabled]="isSubmitting">

                    <span *ngIf="!isSubmitting">Sign In</span>
                    <i *ngIf="!isSubmitting" class="fa-solid fa-arrow-right"></i>

                    <mat-spinner *ngIf="isSubmitting" diameter="24" color="accent"></mat-spinner>
                    <span *ngIf="isSubmitting" class="spinner-text">Authenticating...</span>

                </button>

                <div class="bottom-link">
                    Don't have an account?
                    <a routerLink="/signup">Sign Up</a>
                </div>

            </form>

        </div>

    </div>

</div>
